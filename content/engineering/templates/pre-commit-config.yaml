minimum_pre_commit_version: "4.0.0"
exclude: ^(?:\.build/|mobile/(?:ios|android)/)

repos:
  - repo: local
    hooks:
      - id: python-quality
        name: Python lint, docstrings and format
        entry: ./scripts/check-python.sh
        language: system
        types_or: [python, pyi]
      - id: python-quality-config
        name: Python quality configuration
        entry: ./scripts/check-python.sh
        language: system
        files: ^(?:ruff\.toml|backend/pyproject\.toml|\.pre-commit-config\.yaml)$
        pass_filenames: false
      - id: branch-name
        name: Rename the temporary agent branch before committing
        entry: python3 scripts/dev/claude_hooks.py check-branch
        language: system
        always_run: true
        pass_filenames: false
